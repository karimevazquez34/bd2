<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Módulo de Captura Global</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            color: #333;
            margin: 0;
            padding: 10px;
            background-color: #ffffff;
        }

        h2 {
            margin-top: 0;
            font-size: 24px;
            color: #007bff;
        }

        hr {
            border: 0;
            border-top: 2px solid #007bff;
            margin-bottom: 20px;
        }

        /* Estructura de pantalla dividida */
        .panel-contenedor {
            display: flex;
            gap: 25px;
            align-items: flex-start;
        }

        /* COLUMNA IZQUIERDA: Todos los formularios juntos */
        .columna-izquierda {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            gap: 25px;
            max-height: 550px;
            overflow-y: auto; /* Permite scroll si los formularios son muy largos */
            padding-right: 10px;
        }

        /* COLUMNA DERECHA: Espacio para nuevos registros */
        .columna-derecha {
            flex: 0.8;
            background-color: #ffffff;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #dee2e6;
            min-height: 500px;
            position: sticky;
            top: 0;
        }

        .columna-derecha h3 {
            margin-top: 0;
            color: #495057;
            border-bottom: 2px solid #6c757d;
            padding-bottom: 6px;
            font-size: 16px;
        }

        /* Cajas individuales para cada sección de formulario */
        .bloque-formulario {
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #ced4da;
        }

        .bloque-formulario h3 {
            margin-top: 0;
            margin-bottom: 12px;
            font-size: 15px;
            color: #007bff;
            border-bottom: 1px solid #dee2e6;
            padding-bottom: 5px;
            text-transform: uppercase;
        }

        .grupo-campo {
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
        }

        .grupo-campo label {
            font-weight: bold;
            margin-bottom: 4px;
            font-size: 13px;
        }

        .grupo-campo input, .grupo-campo select {
            padding: 7px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            font-size: 13px;
            box-sizing: border-box;
            width: 100%;
        }

        /* Botón de registrar (No funcional actualmente) */
        .btn-registrar {
            background-color: #6c757d; /* Color gris para indicar que está estático */
            color: white;
            border: none;
            padding: 10px 15px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            width: 100%;
            margin-top: 5px;
            transition: background 0.2s;
        }

        .btn-registrar:hover {
            background-color: #495057;
        }

        .texto-ayuda {
            color: #999;
            font-style: italic;
            text-align: center;
            margin-top: 50px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <h2>MÓDULO DE CAPTURA GENERAL</h2>
    <hr>

    <div class="panel-contenedor">
        
        <!-- COLUMNA IZQUIERDA: Todos los formularios independientes -->
        <div class="columna-izquierda">
            
            <!-- FORMULARIO 1: PACIENTES -->
            <div class="bloque-formulario">
                <h3>+ Registro de Pacientes</h3>
                <form action="#" method="POST" onsubmit="return false;">
                    <div class="grupo-campo"><label>ID Paciente:</label><input type="number" placeholder="Ej. 11"></div>
                    <div class="grupo-campo"><label>Nombre Completo:</label><input type="text" placeholder="Nombre completo"></div>
                    <div class="grupo-campo"><label>Fecha de Nacimiento:</label><input type="date"></div>
                    <div class="grupo-campo">
                        <label>Género:</label>
                        <select>
                            <option value="Femenino">Femenino</option>
                            <option value="Masculino">Masculino</option>
                        </select>
                    </div>
                    <div class="grupo-campo"><label>Tipo de Sangre:</label><input type="text" placeholder="Ej. O+"></div>
                    <div class="grupo-campo"><label>Teléfono:</label><input type="text" placeholder="656-123-4567"></div>
                    <div class="grupo-campo"><label>Tel. Emergencia:</label><input type="text" placeholder="656-123-4567"></div>
                    <button type="button" class="btn-registrar">Registrar Paciente</button>
                </form>
            </div>

            <!-- FORMULARIO 2: DOCTORES -->
            <div class="bloque-formulario">
                <h3>+ Registro de Doctores</h3>
                <form action="#" method="POST" onsubmit="return false;">
                    <div class="grupo-campo"><label>ID Médico:</label><input type="number" placeholder="Ej. 110"></div>
                    <div class="grupo-campo"><label>Nombre del Doctor:</label><input type="text" placeholder="Ej. Dr. Ramirez Perez"></div>
                    <div class="grupo-campo"><label>Especialidad:</label><input type="text" placeholder="Ej. Cardiología"></div>
                    <div class="grupo-campo"><label>Núm. Licencia:</label><input type="text" placeholder="Ej. MS-12345"></div>
                    <div class="grupo-campo">
                        <label>Turno:</label>
                        <select>
                            <option value="Mañana">Mañana</option>
                            <option value="Tarde">Tarde</option>
                            <option value="Noche">Noche</option>
                        </select>
                    </div>
                    <div class="grupo-campo"><label>Departamento:</label><input type="text" placeholder="Ej. D10"></div>
                    <button type="button" class="btn-registrar">Registrar Doctor</button>
                </form>
            </div>

            <!-- FORMULARIO 3: MEDICAMENTOS -->
            <div class="bloque-formulario">
                <h3>+ Registro de Medicamentos</h3>
                <form action="#" method="POST" onsubmit="return false;">
                    <div class="grupo-campo"><label>ID Medicamento:</label><input type="text" placeholder="Ej. M-11"></div>
                    <div class="grupo-campo"><label>Nombre Comercial:</label><input type="text" placeholder="Ej. Aspirina"></div>
                    <div class="grupo-campo"><label>Concentración:</label><input type="text" placeholder="Ej. 500 mg"></div>
                    <div class="grupo-campo"><label>Presentación:</label><input type="text" placeholder="Ej. Tabletas"></div>
                    <div class="grupo-campo"><label>Stock:</label><input type="number" placeholder="100"></div>
                    <div class="grupo-campo"><label>Fecha Vencimiento:</label><input type="date"></div>
                    <button type="button" class="btn-registrar">Registrar Medicamento</button>
                </form>
            </div>

            <!-- FORMULARIO 4: DIAGNÓSTICOS -->
            <div class="bloque-formulario">
                <h3>+ Registro de Diagnósticos</h3>
                <form action="#" method="POST" onsubmit="return false;">
                    <div class="grupo-campo"><label>ID Receta:</label><input type="text" placeholder="Ej. R-510"></div>
                    <div class="grupo-campo"><label>ID Historial:</label><input type="text" placeholder="Ej. H-1010"></div>
                    <div class="grupo-campo"><label>ID Medicamento:</label><input type="text" placeholder="Ej. M-01"></div>
                    <div class="grupo-campo"><label>Dosis:</label><input type="text" placeholder="Ej. 1 tableta"></div>
                    <div class="grupo-campo"><label>Frecuencia:</label><input type="text" placeholder="Ej. Cada 8 horas"></div>
                    <div class="grupo-campo"><label>Duración:</label><input type="text" placeholder="Ej. 7 días"></div>
                    <button type="button" class="btn-registrar">Registrar Diagnóstico</button>
                </form>
            </div>

            <!-- FORMULARIO 5: CITAS -->
            <div class="bloque-formulario">
                <h3>+ Registro de Citas</h3>
                <form action="#" method="POST" onsubmit="return false;">
                    <div class="grupo-campo"><label>ID Cita:</label><input type="text" placeholder="Ej. C-011"></div>
                    <div class="grupo-campo"><label>ID Paciente:</label><input type="number" placeholder="Paciente ID"></div>
                    <div class="grupo-campo"><label>ID Médico:</label><input type="number" placeholder="Médico ID"></div>
                    <div class="grupo-campo"><label>Fecha:</label><input type="date"></div>
                    <div class="grupo-campo"><label>Hora:</label><input type="time"></div>
                    <div class="grupo-campo"><label>Consultorio:</label><input type="text" placeholder="Ej. A-02"></div>
                    <div class="grupo-campo">
                        <label>Estado:</label>
                        <select>
                            <option value="PENDIENTE">PENDIENTE</option>
                            <option value="COMPLETADO">COMPLETADO</option>
                            <option value="CANCELADO">CANCELADO</option>
                        </select>
                    </div>
                    <button type="button" class="btn-registrar">Registrar Cita</button>
                </form>
            </div>

        </div>

        <!-- COLUMNA DERECHA: Visualizador pasivo (Estático) -->
        <div class="columna-derecha">
            <h3>Nuevos Registros Capturados</h3>
            <div id="contenedor-nuevos-registros">
                <p class="texto-ayuda">
                    Los nuevos datos aparecerán en esta sección una vez que se conecte el backend o la base de datos dinámica.
                </p>
            </div>
        </div>

    </div>

</body>
</html>
