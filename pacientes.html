<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pacientes</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            color: #333;
            margin: 0;
            padding: 20px;
            background-color: #ffffff;
        }

        h2 {
            margin-top: 0;
            font-size: 24px;
            color: #007bff;
        }

        hr {
            border: 0;
            border-top: 2px solid #007bff;
            margin-bottom: 20px;
        }

        /* Estructura en dos columnas */
        .seccion-columnas {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }

        .columna-formulario {
            flex: 1;
            position: sticky;
            top: 10px;
        }

        .columna-registros {
            flex: 1.5;
            max-height: 600px;
            overflow-y: auto;
            padding-right: 5px;
        }

        /* Estilo del Formulario para Agregar */
        .formulario-agregar {
            background-color: #f1f3f5;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            border: 1px solid #ced4da;
        }

        .formulario-agregar h3 {
            margin-top: 0;
            margin-bottom: 15px;
            color: #495057;
        }

        .grupo-campo {
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
        }

        .grupo-campo label {
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .grupo-campo input, .grupo-campo select {
            padding: 8px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            font-size: 14px;
        }

        .btn-guardar {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
            width: 100%;
        }

        .btn-guardar:hover {
            background-color: #218838;
        }

        /* Estilo de los bloques de registros */
        .data-block {
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 11pt;
            margin-bottom: 15px;
            border: 1px solid #e9ecef;
        }
        
        .data-block ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }

        .data-block li {
            margin-bottom: 4px;
        }
    </style>
</head>
<body>

    <h2>PACIENTES</h2>
    <hr>

    <div class="seccion-columnas">
        <div class="columna-formulario">
            <div class="formulario-agregar">
                <h3>+ Registrar Nuevo Paciente</h3>
                <form id="formPaciente" onsubmit="agregarPaciente(event)">
                    <div class="grupo-campo">
                        <label>ID Paciente:</label>
                        <input type="number" id="id_paciente" required placeholder="Ej. 11">
                    </div>

                    <div class="grupo-campo">
                        <label>Nombre Completo:</label>
                        <input type="text" id="nombre" required placeholder="Nombre del paciente">
                    </div>

                    <div class="grupo-campo">
                        <label>Fecha de Nacimiento:</label>
                        <input type="date" id="fecha_nacimiento" required>
                    </div>

                    <div class="grupo-campo">
                        <label>Género:</label>
                        <select id="genero" required>
                            <option value="">Selecciona una opción</option>
                            <option value="Femenino">Femenino</option>
                            <option value="Masculino">Masculino</option>
                        </select>
                    </div>

                    <div class="grupo-campo">
                        <label>Tipo de Sangre:</label>
                        <input type="text" id="tipo_sangre" required placeholder="Ej. O+, A-">
                    </div>

                    <div class="grupo-campo">
                        <label>Teléfono:</label>
                        <input type="text" id="telefono" required placeholder="Ej. 656-000-00-00">
                    </div>

                    <div class="grupo-campo">
                        <label>Teléfono de Emergencia:</label>
                        <input type="text" id="tel_emergencia" required placeholder="Ej. 656-000-00-00">
                    </div>

                    <button type="submit" class="btn-guardar">Guardar Registro</button>
                </form>
            </div>
        </div>

        <div class="columna-registros">
            <h3>Lista de Registros Actuales</h3>
            <div id="contenedor-registros">
                </div>
        </div>
    </div>

    <script>
        function agregarPaciente(event) {
            event.preventDefault();

            var id = document.getElementById('id_paciente').value;
            var nombre = document.getElementById('nombre').value;
            var fecha = document.getElementById('fecha_nacimiento').value;
            var genero = document.getElementById('genero').value;
            var sangre = document.getElementById('tipo_sangre').value;
            var tel = document.getElementById('telefono').value;
            var telEmergencia = document.getElementById('tel_emergencia').value;

            var nuevoBloque = document.createElement('div');
            nuevoBloque.className = 'data-block';
            
            nuevoBloque.innerHTML = `
                <ul>
                    <li>id_paciente: ${id}</li>
                    <li>nombre: "${nombre}"</li>
                    <li>fecha_nacimiento: "${fecha}"</li>
                    <li>genero: "${genero}"</li>
                    <li>tipo_sangre: "${sangre}"</li>
                    <li>telefono: "${tel}"</li>
                    <li>tel_emergencia: "${telEmergencia}"</li>
                </ul>
            `;

            document.getElementById('contenedor-registros').appendChild(nuevoBloque);
            document.getElementById('formPaciente').reset();
        }
    </script>

</body>
</html>
